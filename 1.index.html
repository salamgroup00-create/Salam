<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة السلام جروب - قائمة الأسعار</title>
  <!-- مكتبة قراءة ملفات الإكسيل -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 900px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
    h1 { color: #1e293b; margin: 0; font-size: 22px; }
    .btn-download { background: #2563eb; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .btn-download:hover { background: #1d4ed8; }
    .table-responsive { width: 100%; overflow-x: auto; max-height: 60vh; border-radius: 8px; border: 1px solid #cbd5e1; }
    table { width: 100%; border-collapse: collapse; text-align: right; background: white; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155; }
    th { background: #f8fafc; color: #1e293b; position: sticky; top: 0; z-index: 10; }
    tr:hover { background: #f1f5f9; }
    .loading { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>شركة السلام جروب</h1>
      <p style="margin: 5px 0 0; color: #64748b; font-size: 13px;">أحدث قائمة أسعار معتمدة</p>
    </div>
    <!-- زر التحميل فوق في الأعلى -->
    <a href="price.xlsx" class="btn-download" download="price.xlsx">📥 تحميل نسخة Excel</a>
  </div>

  <!-- مكان عرض الجدول -->
  <div class="table-responsive">
    <div id="loading" class="loading">جاري تحميل وعرض الأسعار...</div>
    <div id="table-container"></div>
  </div>
</div>

<script>
  // قراءة ملف price.xlsx وعرضه تلقائياً داخل جدول
  fetch('price.xlsx')
    .then(response => {
      if (!response.ok) throw new Error("الملف غير موجود");
      return response.arrayBuffer();
    })
    .then(data => {
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      // تحويل الشيت إلى جدول HTML
      const htmlTable = XLSX.utils.sheet_to_html(worksheet, { header: "" });
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('table-container').innerHTML = htmlTable;
      
      // تعديل تنسيق الجدول ليصبح منسقاً وجميلاً
      const table = document.querySelector('#table-container table');
      if (table) table.className = 'excel-table';
    })
    .catch(error => {
      document.getElementById('loading').innerHTML = "عذراً، لم يتم العثور على ملف الأسعار (price.xlsx) أو حدث خطأ في القراءة.";
    });
</script>

</body>
</html>
