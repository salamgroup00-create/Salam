<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة السلام جروب - قائمة الأسعار</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #e2e8f0; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .container { 
      width: 100%; 
      max-width: 100%; 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      border: 3px solid #1e293b; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
      position: relative; 
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    
    /* الشريط العلوي: اللوجو على اليسار والترحيب على اليمين */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .user-area { display: flex; align-items: center; gap: 15px; }
    
    .login-btn-top { 
      background: #f1f5f9; 
      border: 1px solid #cbd5e1; 
      color: #475569; 
      padding: 6px 14px; 
      border-radius: 6px; 
      font-size: 13px; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .login-btn-top:hover { background: #e2e8f0; color: #0f172a; }

    /* نافذة إدخال الاسم أو الباسورد */
    #loginModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 340px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; }
    .modal-content button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    
    .brand-box { display: flex; align-items: center; gap: 15px; }
    h1 { color: #1e293b; margin: 0; font-size: 22px; }
    
    .btn-download { background: #2563eb; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .btn-download:hover { background: #1d4ed8; }

    /* لوحة التحكم والرفع (لا تظهر إلا للباسورد الصحيح) */
    #adminPanel { display: none; background: #f0fdf4; border: 2px dashed #16a34a; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
    #adminPanel h3 { margin-top: 0; color: #16a34a; font-size: 16px; }
    .file-input { margin: 10px 0; }
    .btn-upload { background: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .table-responsive { width: 100%; flex-grow: 1; overflow: auto; max-height: 75vh; border-radius: 8px; border: 1px solid #cbd5e1; }
    table { width: 100%; border-collapse: collapse; text-align: right; background: white; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155; }
    th { background: #f8fafc; color: #1e293b; position: sticky; top: 0; z-index: 10; }
    tr:hover { background: #f1f5f9; }
    .loading { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
  </style>
</head>
<body>

<!-- نافذة إدخال الاسم أو الباسورد -->
<div id="loginModal">
  <div class="modal-content">
    <h3>تسجيل الدخول</h3>
    <p style="font-size: 13px; color: #64748b;">اكتب اسمك للمتابعة:</p>
    <input type="text" id="userInput" maxlength="10" placeholder="اكتب اسمك (10 حروف أقصى)...">
    <br>
    <button onclick="handleLoginSubmit()">موافق</button>
    <button onclick="closeLoginModal()" style="background:none; color:#ef4444; border:none; margin-top:10px; cursor:pointer;">إلغاء</button>
  </div>
</div>

<div class="container">
  
  <!-- الشريط العلوي: الترحيب يميناً واللوجو وزر الدخول يساراً -->
  <div class="top-bar">
    <div id="welcomeUser" style="font-weight: bold; color: #1e293b; font-size: 16px;"></div>
    <div class="user-area">
      <button class="login-btn-top" onclick="openLoginModal()">تسجيل الدخول</button>
      <!-- اللوجو على يسار اسم المستخدم -->
      <img src="logo.png" alt="شعار السلام" style="width: 45px; height: 45px; object-fit: contain; border-radius: 6px;" onerror="this.style.display='none'">
    </div>
  </div>

  <!-- لوحة الأدمن -->
  <div id="adminPanel">
    <h3>⚙️ لوحة تحكم الأدمن (رفع الملفات أونلاين)</h3>
    <p style="font-size: 13px; color: #475569;">الصق الـ GitHub Token الخاص بك هنا، ثم اختر ملف الإكسيل:</p>
    <input type="password" id="gitToken" placeholder="ألصق الـ Token هنا (ghp_...)" style="width: 80%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
    <br>
    <input type="file" id="excelFile" class="file-input" accept=".xlsx, .xls">
    <br>
    <button class="btn-upload" onclick="uploadToGitHub()">رفع وتحديث الملف على جيت هب فوراً</button>
    <button onclick="hideAdminPanel()" style="background:none; border:none; color:#ef4444; cursor:pointer; margin-right: 10px; font-size: 13px;">إغلاق</button>
  </div>

  <div class="header">
    <div class="brand-box">
      <div>
        <h1>شركة السلام جروب</h1>
        <!-- ملاحظة التاريخ التلقائي لليوم -->
        <p id="priceDate" style="margin: 5px 0 0; color: #b91c1c; font-size: 13px; font-weight: bold;"></p>
      </div>
    </div>
    
    <div>
      <a href="price.xlsx" class="btn-download" download="price.xlsx">📥 تحميل نسخة Excel</a>
    </div>
  </div>

  <div class="table-responsive">
    <div id="loading" class="loading">جاري تحميل وعرض الأسعار...</div>
    <div id="table-container"></div>
  </div>
</div>

<script>
  const ADMIN_SECRET = "salam2026";

  window.onload = function() {
    let savedUser = localStorage.getItem("salam_username");
    if (savedUser) {
      document.getElementById("welcomeUser").innerText = "Hello " + savedUser;
    }

    let savedToken = localStorage.getItem("github_token");
    if (savedToken) {
      document.getElementById("gitToken").value = savedToken;
    }

    // عرض تاريخ اليوم تلقائياً بصيغة (السنة - الشهر - اليوم)
    let today = new Date();
    let yyyy = today.getFullYear();
    let mm = String(today.getMonth() + 1).padStart(2, '0');
    let dd = String(today.getDate()).padStart(2, '0');
    document.getElementById("priceDate").innerText = `هذه الأسعار بتاريخ: ${yyyy}/${mm}/${dd}`;
  };

  function openLoginModal() {
    document.getElementById("userInput").value = "";
    document.getElementById("loginModal").style.display = "flex";
  }

  function closeLoginModal() {
    document.getElementById("loginModal").style.display = "none";
  }

  function handleLoginSubmit() {
    let val = document.getElementById("userInput").value.trim();
    if (val === "") {
      alert("الرجاء كتابة شيء!");
      return;
    }

    if (val === ADMIN_SECRET) {
      document.getElementById("adminPanel").style.display = "block";
      alert("تم التحقق بنجاح! ظهرت لوحة التحكم بالأسفل.");
      closeLoginModal();
      return;
    }

    // شرط التحقق الصارم: حروف وأرقام فقط بدون أي رموز أو مسافات نهائياً، وبحد أقصى 10
    let regex = /^[آ-يأإؤةىa-zA-Z0-9٠-٩]{1,10}$/;
    
    if (!regex.test(val)) {
      alert("عذراً! الاسم يجب ألا يتجاوز 10 حروف، ويسمح بالحروف والأرقام فقط **بدون أي رموز أو مسافات**.");
      return;
    }

    localStorage.setItem("salam_username", val);
    document.getElementById("welcomeUser").innerText = "Hello " + val;
    closeLoginModal();
  }

  function hideAdminPanel() {
    document.getElementById('adminPanel').style.display = 'none';
  }

  // تحميل وعرض الجدول مع منع التخزين المؤقت
  fetch('price.xlsx?v=' + new Date().getTime())
    .then(response => {
      if (!response.ok) throw new Error("الملف غير موجود");
      return response.arrayBuffer();
    })
    .then(data => {
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      const htmlTable = XLSX.utils.sheet_to_html(worksheet, { header: "" });
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('table-container').innerHTML = htmlTable;
    })
    .catch(error => {
      document.getElementById('loading').innerHTML = "عذراً، لم يتم العثور على ملف الأسعار (price.xlsx).";
    });

  async function uploadToGitHub() {
    let token = document.getElementById('gitToken').value.trim();
    let fileInput = document.getElementById('excelFile');

    if (!token) {
      alert("الرجاء إدخال GitHub Token!");
      return;
    }
    if (fileInput.files.length === 0) {
      alert("الرجاء اختيار ملف الإكسيل!");
      return;
    }

    localStorage.setItem("github_token", token);

    let file = fileInput.files[0];
    let reader = new FileReader();

    reader.onload = async function(e) {
      let contentBytes = e.target.result;
      let base64Content = btoa(String.fromCharCode.apply(null, new Uint8Array(contentBytes)));

      let owner = "salamgroup00-create"; 
      let repo = "Salam"; 
      let path = "price.xlsx";

      alert("جاري رفع الملف وتحديث الأسعار أونلاين، انتظر ثوانٍ...");

      try {
        let getUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        let getRes = await fetch(getUrl, {
          headers: { "Authorization": `token ${token}` }
        });
        
        let sha = null;
        if (getRes.ok) {
          let fileData = await getRes.json();
          sha = fileData.sha;
        }

        let putRes = await fetch(getUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Update price.xlsx via Web Admin",
            content: base64Content,
            sha: sha
          })
        });

        if (putRes.ok) {
          alert("تم تحديث الأسعار بنجاح! ستظهر البيانات للمستخدمين خلال دقيقة.");
          location.reload();
        } else {
          let errData = await putRes.json();
          alert("حدث خطأ أثناء الرفع: " + errData.message);
        }

      } catch (err) {
        alert("فشل الاتصال بالإنترنت أو خطأ في الـ Token.");
      }
    };

    reader.readAsArrayBuffer(file);
  }
</script>

</body>
</html>
